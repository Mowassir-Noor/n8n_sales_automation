name: dashboard

on:
  push:
    branches: ["**"]
    tags: ["dashboard-v*"]
    paths:
      - "dashboard/**"
      - "WF*.json"
      - "DB-*.json"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "WF*.json"
      - "DB-*.json"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Drift check (shared email code vs WF2/WF3/WF5 exports)
        run: npm run test:drift

      - name: Unit and snapshot tests
        run: npx vitest run

      - name: Typecheck
        run: npm run typecheck

      - name: n8n workflow sources are up to date
        run: npm run sync:n8n -- --check

      - name: Next.js production build
        run: npx next build

  image:
    name: Build and push image
    if: startsWith(github.ref, 'refs/tags/dashboard-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/texprove-dashboard
          tags: |
            type=match,pattern=dashboard-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=dashboard-v(\d+\.\d+),group=1
            type=sha,format=short

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
